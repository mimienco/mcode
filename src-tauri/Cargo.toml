[package]
name = "mcode-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mcode_desktop"
crate-type = ["rlib"]

[[bin]]
name = "mcode-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mcode-app = { path = "../crates/mcode-app" }
crossbeam-channel = "0.5"
mcode-fs = { path = "../crates/mcode-fs" }
mcode-pty = { path = "../crates/mcode-pty" }
mcode-process = { path = "../crates/mcode-process" }
mcode-platform = { path = "../crates/mcode-platform" }
mcode-settings = { path = "../crates/mcode-settings" }
mcode-updater = { path = "../crates/mcode-updater" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-updater = "=2.10.1"
