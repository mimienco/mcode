[package]
name = "mcode-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mcode_desktop"
crate-type = ["rlib"]

[[bin]]
name = "mcode-tauri"
path = "src/main.rs"

[features]
# Opt-in clipboard roundtrip test (`--features clipboard-roundtrip-tests`);
# touches the live OS clipboard, so it never runs in the default suite.
clipboard-roundtrip-tests = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mcode-app = { path = "../crates/mcode-app" }
arboard.workspace = true
crossbeam-channel = "0.5"
mcode-fs = { path = "../crates/mcode-fs" }
mcode-pty = { path = "../crates/mcode-pty" }
mcode-process = { path = "../crates/mcode-process" }
mcode-platform = { path = "../crates/mcode-platform" }
mcode-settings = { path = "../crates/mcode-settings" }
mcode-updater = { path = "../crates/mcode-updater" }
mcode-ssh = { path = "../crates/mcode-ssh" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-updater = "=2.10.1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "io-util", "time", "rt", "macros", "net"] }
