[package]
name = "mcode-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mcode_desktop"
crate-type = ["rlib"]

[[bin]]
name = "mcode-tauri"
path = "src/main.rs"

[features]
# Opt-in clipboard roundtrip test (`--features clipboard-roundtrip-tests`);
# touches the live OS clipboard, so it never runs in the default suite.
clipboard-roundtrip-tests = []

[build-dependencies]
tauri-build.workspace = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(rust_analyzer)", "cfg(devtools)"] }

[dependencies]
mcode-agent-status = { path = "../crates/mcode-agent-status" }
parking_lot = "0.12"
getrandom.workspace = true
mcode-diagnostics = { path = "../crates/mcode-diagnostics" }
mcode-app = { path = "../crates/mcode-app" }
arboard.workspace = true
mcode-wire = { path = "../crates/mcode-wire" }
crossbeam-channel = "0.5"
mcode-fs = { path = "../crates/mcode-fs" }
mcode-git = { path = "../crates/mcode-git" }
notify = { version = "7", features = ["crossbeam-channel"] }
mcode-pty = { path = "../crates/mcode-pty" }
mcode-process = { path = "../crates/mcode-process" }
mcode-platform = { path = "../crates/mcode-platform" }
mcode-settings = { path = "../crates/mcode-settings" }
mcode-updater = { path = "../crates/mcode-updater" }
mcode-ssh = { path = "../crates/mcode-ssh" }
mcode-voice = { path = "../crates/mcode-voice" }
# Blocking download transport for the speech model fetcher. Match
# tauri-plugin-updater's TLS stack: rustls via the ring provider
# (no-provider + explicit rustls dep keeps a single provider in the binary).
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-updater = "=2.10.1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-notification = "2"
base64.workspace = true
url.workspace = true
tokio = { version = "1", features = ["sync", "io-util", "time", "rt", "macros", "net", "fs"] }

[dev-dependencies]
tempfile = "3"
tauri = { workspace = true, features = ["tray-icon", "test"] }
