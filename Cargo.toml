[workspace]
members = ["crates/mcode-app", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.4.178"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/mimienco/mcode"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5" }
tauri-build = { version = "2.6.3" }
