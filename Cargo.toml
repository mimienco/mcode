[workspace]
members = [
  "crates/mcode-app",
  "crates/mcode-fs",
  "crates/mcode-git",
  "crates/mcode-platform",
  "crates/mcode-settings",
  "crates/mcode-updater",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.4.178"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/mimienco/mcode"

[workspace.dependencies]
atomic-write-file = "0.3.1"
base64 = "0.22.1"
cap-std = "=4.0.2"
getrandom = "=0.3.4"
same-file = "=1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = { version = "2.6.3" }
url = "2.5.8"
